<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>小熊猫 · Red Panda</title>
    <meta name="theme-color" id="theme-color" content="#f7f2e8" />
    <meta name="description" content="小熊猫 Red Panda — 记录属于你的山海旅程" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="小熊猫" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('red-panda.theme') || 'system';
          if (mode !== 'light' && mode !== 'dark') mode = 'system';
          var dark = mode === 'dark';
          if (mode === 'system') {
            if (window.AndroidTheme && window.AndroidTheme.isSystemDark) {
              dark = Boolean(window.AndroidTheme.isSystemDark());
            } else if (window.matchMedia) {
              dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            }
          }
          var root = document.documentElement;
          root.setAttribute('data-theme', dark ? 'dark' : 'light');
          root.setAttribute('data-theme-mode', mode);
          root.style.colorScheme = dark ? 'dark' : 'light';
          root.style.backgroundColor = dark ? '#14191a' : '#f7f2e8';
          // Android 的 WebView 延伸到状态栏下面，首屏就要拿到顶部留白，避免内容先被遮住再跳下来。
          if (window.AndroidBars && window.AndroidBars.getTopInsetDp) {
            var top = window.AndroidBars.getTopInsetDp();
            if (top > 0) root.style.setProperty('--status-h', top + 'px');
          }
          try {
            if (window.AndroidBars) {
              if (typeof window.AndroidBars.getLeftInsetDp === 'function') {
                var l = window.AndroidBars.getLeftInsetDp();
                if (l > 0) root.style.setProperty('--safe-left', l + 'px');
              }
              if (typeof window.AndroidBars.getRightInsetDp === 'function') {
                var r = window.AndroidBars.getRightInsetDp();
                if (r > 0) root.style.setProperty('--safe-right', r + 'px');
              }
            }
          } catch (e) {}
          window.__redPandaInsets = function(insets) {
            try {
              if (!insets) return;
              if (typeof insets.top === 'number' && insets.top >= 0) root.style.setProperty('--status-h', (insets.top > 0 ? insets.top : 0) + 'px');
              if (typeof insets.left === 'number' && insets.left >= 0) root.style.setProperty('--safe-left', Math.max(insets.left, 0) + 'px');
              if (typeof insets.right === 'number' && insets.right >= 0) root.style.setProperty('--safe-right', Math.max(insets.right, 0) + 'px');
              if (typeof insets.bottom === 'number' && insets.bottom >= 0) root.style.setProperty('--safe-bottom-native', Math.max(insets.bottom, 0) + 'px');
              root.style.setProperty('--safe-bottom', 'max(var(--safe-bottom-native), env(safe-area-inset-bottom, 0px))');
            } catch (e) {}
          };
          var meta = document.getElementById('theme-color');
          if (meta) meta.setAttribute('content', dark ? '#14191a' : '#f7f2e8');
        } catch (error) {}
      })();
    </script>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="css/journey-memories.css" />
    <link rel="stylesheet" href="css/settings-theme.css" />
  </head>
  <body>
    <div id="app" aria-live="polite"></div>
    <div id="app-status" class="app-status" role="status" hidden></div>
    <div id="app-overlay" class="app-overlay"></div>
    <div id="app-nav" class="app-nav" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="config.js"></script>
    <script src="connection.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/media.js"></script>
    <script src="js/backup.js"></script>
    <script src="js/sw-register.js"></script>
    <script src="app.js"></script>
  </body>
</html>
